name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -q "$ZIP_FILE" -d my_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build Project
        run: |
          PROJECT_ROOT=$(dirname "$(find my_project -name "settings.gradle*" | head -n 1)")
          cd "$PROJECT_ROOT"
          
          # 1. Base Setup
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          
          # 2. FORCE FIX for KSP AWT NullPointerException
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" > ~/.gradle/gradle.properties
          echo "ksp.incremental=false" >> ~/.gradle/gradle.properties
          
          # 3. FIX for google-services.json
          APP_DIR=$(dirname "$(find . -name "build.gradle*" -exec grep -l "com.android.application" {} + | head -n 1)")
          if [ -z "$APP_DIR" ]; then APP_DIR="app"; fi
          mkdir -p "$APP_DIR"
          cat << 'EOF' > "$APP_DIR/google-services.json"
          {
            "project_info": { "project_number": "123456789012", "project_id": "dummy-project" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", "android_client_info": { "package_name": "com.aistudio.aivideocreator.hub.v3x" } },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKeyD" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            } ],
            "configuration_version": "1"
          }
          EOF
          
          # 4. FIX for Keystore Error
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
          # 5. FORCE FIX for Kotlin Compose (AbstractMethodError)
          find . -name "build.gradle*" -type f -exec sed -i -E 's/kotlinCompilerExtensionVersion[[:space:]]*=?[[:space:]]*["'\''][0-9.]+["'\'']/kotlinCompilerExtensionVersion = "1.5.10"/g' {} +
          if [ -f gradle/libs.versions.toml ]; then
            sed -i -E 's/compose-compiler[[:space:]]*=[[:space:]]*["'\''][0-9.]+["'\'']/compose-compiler = "1.5.10"/g' gradle/libs.versions.toml
          fi
          
          cat << 'EOF' > override.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'androidx.compose.compiler' && details.requested.name == 'compiler') {
                          details.useVersion '1.5.10'
                      }
                  }
              }
          }
          EOF
          
          # 6. Start Build with all forced fixes
          gradle assembleDebug --no-daemon --stacktrace --init-script override.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_project/**/app/build/outputs/apk/debug/*.apk
