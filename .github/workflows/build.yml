name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -q "$ZIP_FILE" -d my_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build Project
        run: |
          PROJECT_ROOT=$(dirname "$(find my_project -name "settings.gradle*" | head -n 1)")
          cd "$PROJECT_ROOT"
          
          # 1. Base Setup
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" >> gradle.properties
          
          # 2. BULLETPROOF Fix for google-services.json
          APP_DIR=$(dirname "$(find . -name "build.gradle*" -exec grep -l "com.android.application" {} + | head -n 1)")
          if [ -z "$APP_DIR" ]; then APP_DIR="app"; fi
          mkdir -p "$APP_DIR"
          
          cat << 'EOF' > "$APP_DIR/google-services.json"
          {
            "project_info": { "project_number": "123456789012", "project_id": "dummy-project" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", "android_client_info": { "package_name": "com.aistudio.aivideocreator.hub.v3x" } },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKeyD" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            } ],
            "configuration_version": "1"
          }
          EOF
          
          # 3. Fix Keystore Error
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
          # 4. Fix Kotlin Compose Error
          cat << 'EOF' > compose-fix.gradle
          allprojects {
              afterEvaluate { project ->
                  project.tasks.configureEach { task ->
                      if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
                          try {
                              task.kotlinOptions.freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"]
                          } catch (Exception e) {}
                      }
                  }
              }
          }
          EOF
          
          # 5. Start Build
          gradle assembleDebug --no-daemon --stacktrace --init-script compose-fix.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_project/**/app/build/outputs/apk/debug/*.apk
