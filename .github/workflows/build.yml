name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -q "$ZIP_FILE" -d my_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build Project
        run: |
          PROJECT_ROOT=$(dirname "$(find my_project -name "settings.gradle*" | head -n 1)")
          cd "$PROJECT_ROOT"
          
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          
          # Memory, Headless & Performance Fixes
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dkotlin.daemon.jvm.options=-Xmx2g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          
          # Keystore Error Fix
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts
          
          # Build with NO DAEMON to prevent memory crash
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_project/**/app/build/outputs/apk/debug/*.apk

