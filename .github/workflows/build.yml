name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: unzip *.zip -d my_project

      - name: Create .env file (For API Key)
        run: echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > my_project/.env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: cd my_project && chmod +x gradlew

      - name: Build Debug APK
        run: cd my_project && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_project/app/build/outputs/apk/debug/app-debug.apk

