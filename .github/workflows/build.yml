name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -q "$ZIP_FILE" -d my_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build Project
        run: |
          PROJECT_ROOT=$(dirname "$(find my_project -name "settings.gradle*" | head -n 1)")
          cd "$PROJECT_ROOT"
          
          # 1. Base Setup
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" > ~/.gradle/gradle.properties
          
          # 2. Fix google-services.json
          APP_DIR=$(dirname "$(find . -name "build.gradle*" -exec grep -l "com.android.application" {} + | head -n 1)")
          if [ -z "$APP_DIR" ]; then APP_DIR="app"; fi
          mkdir -p "$APP_DIR"
          cat << 'EOF' > "$APP_DIR/google-services.json"
          {
            "project_info": { "project_number": "123456789012", "project_id": "dummy-project" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", "android_client_info": { "package_name": "com.aistudio.aivideocreator.hub.v3x" } },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKeyD" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            } ],
            "configuration_version": "1"
          }
          EOF
          
          # 3. Fix Keystore Error
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
          # 4. SMART SCANNER: Auto-Fix Kotlin & Compose Version Mismatch
          cat << 'EOF' > fix_versions.py
          import os, re
          kv = "1.9.0"
          found = False
          for root, dirs, files in os.walk("."):
              if found: break
              for file in files:
                  if file.endswith((".gradle", ".gradle.kts", ".toml")):
                      try:
                          with open(os.path.join(root, file), "r", encoding="utf-8") as f:
                              m = re.search(r'(?:kotlin|org\.jetbrains\.kotlin\.android|kotlin-android)[^0-9]+([1-2]\.[0-9]+\.[0-9]+)', f.read())
                              if m: kv, found = m.group(1), True; break
                      except: pass
          
          mapping = {"1.9.24":"1.5.14", "1.9.23":"1.5.11", "1.9.22":"1.5.10", "1.9.21":"1.5.7", "1.9.20":"1.5.4", "1.9.10":"1.5.3", "1.9.0":"1.5.1", "1.8.22":"1.4.8", "1.8.21":"1.4.7", "1.8.20":"1.4.6", "1.8.10":"1.4.2", "1.8.0":"1.4.0"}
          cv = "1.5.1"
          for k, v in mapping.items():
              if kv.startswith(k[:4]): cv = v
          if kv in mapping: cv = mapping[kv]
          
          script = f"""
          allprojects {{
              buildscript {{ configurations.all {{ resolutionStrategy.eachDependency {{ if (it.requested.group == 'androidx.compose.compiler' && it.requested.name == 'compiler') {{ it.useVersion '{cv}' }} }} }} }}
              configurations.all {{ resolutionStrategy.eachDependency {{ if (it.requested.group == 'androidx.compose.compiler' && it.requested.name == 'compiler') {{ it.useVersion '{cv}' }} }} }}
          }}
          """
          with open("compose-fix.gradle", "w") as f: f.write(script)
          EOF
          python3 fix_versions.py
          
          # 5. Start Build with all fixes applied
          gradle assembleDebug --no-daemon --stacktrace --init-script compose-fix.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_project/**/app/build/outputs/apk/debug/*.apk
